
name: Build Filza WQ Cached

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out builder
        uses: actions/checkout@v4

      - name: Download and extract original IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/base"

          echo "Available release assets:"
          gh release view v0-base \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name'

          gh release download v0-base \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/base"

          python3 - <<'PY'
          import os
          import shutil
          import zipfile
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          source = root / "base"
          output = root / "filza_base.ipa"

          assets = [
              p for p in source.iterdir()
              if p.is_file()
              and p.suffix.lower() in (".ipa", ".zip")
          ]

          if len(assets) != 1:
              raise SystemExit(
                  f"Expected one IPA or ZIP asset, "
                  f"found: {[p.name for p in assets]}"
              )

          asset = assets[0]
          print("Found:", asset.name)

          if asset.suffix.lower() == ".ipa":
              shutil.copyfile(asset, output)
          else:
              with zipfile.ZipFile(asset) as archive:
                  matches = [
                      n for n in archive.namelist()
                      if n.lower().endswith(".ipa")
                      and not n.startswith("__MACOSX/")
                  ]

                  if len(matches) == 1:
                      with archive.open(matches[0]) as src:
                          with output.open("wb") as dst:
                              shutil.copyfileobj(src, dst)
                  elif any(
                      n.startswith("Payload/")
                      for n in archive.namelist()
                  ):
                      shutil.copyfile(asset, output)
                  else:
                      raise SystemExit(
                          "ZIP does not contain a valid IPA"
                      )

          with zipfile.ZipFile(output) as archive:
              required = (
                  "Payload/Filza.app/Frameworks/"
                  "FilzaApplySandboxExt.dylib"
              )
              if required not in archive.namelist():
                  raise SystemExit(
                      "Required Filza library not found"
                  )

          print("Base IPA successfully prepared")
          PY

      - name: Verify original Filza binary
        run: |
          mkdir -p "$RUNNER_TEMP/payload"
          cd "$RUNNER_TEMP/payload"

          unzip -q "$RUNNER_TEMP/filza_base.ipa"

          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          binary = (
              Path(os.environ["RUNNER_TEMP"])
              / "payload/Payload/Filza.app/Frameworks/"
                "FilzaApplySandboxExt.dylib"
          )

          actual = hashlib.sha256(
              binary.read_bytes()
          ).hexdigest()

          expected = (
              "0e7a31be8d4bcaa6f6a050d66c6096c"
              "f02d479a42ea0aba07b97b55d0d04f7c5"
          )

          if actual != expected:
              raise SystemExit(
                  f"Filza baseline mismatch: {actual}"
              )

          print("Verified original Filza binary")
          PY

      - name: Compile native iOS cache library
        run: |
          APP="$RUNNER_TEMP/payload/Payload/Filza.app"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -miphoneos-version-min=17.0 \
            -isysroot "$SDK" \
            -O2 \
            -fobjc-arc \
            -fvisibility=hidden \
            -dynamiclib \
            -Wl,-install_name,@loader_path/WQScanCache.dylib \
            -framework Foundation \
            -o "$APP/Frameworks/WQScanCache.dylib" \
            src/WQScanCache.m

          file "$APP/Frameworks/WQScanCache.dylib"

      - name: Integrate cache into Filza
        run: |
          git clone -q --depth 1 \
            https://github.com/tyilo/insert_dylib.git \
            "$RUNNER_TEMP/insert_dylib"

          xcodebuild \
            -project \
            "$RUNNER_TEMP/insert_dylib/insert_dylib.xcodeproj" \
            -scheme insert_dylib \
            -configuration Release \
            -derivedDataPath \
            "$RUNNER_TEMP/insert-dylib-build" \
            CODE_SIGNING_ALLOWED=NO \
            build

          TOOL="$(find \
            "$RUNNER_TEMP/insert-dylib-build" \
            -type f \
            -name insert_dylib \
            -perm -111 | head -n 1)"

          test -n "$TOOL"

          APP="$RUNNER_TEMP/payload/Payload/Filza.app"

          "$TOOL" \
            --inplace \
            --all-yes \
            '@loader_path/WQScanCache.dylib' \
            "$APP/Frameworks/FilzaApplySandboxExt.dylib"

          otool -L \
            "$APP/Frameworks/FilzaApplySandboxExt.dylib" \
            | grep -F '@loader_path/WQScanCache.dylib'

      - name: Sign modified application
        run: |
          APP="$RUNNER_TEMP/payload/Payload/Filza.app"

          codesign \
            --force --sign - --timestamp=none \
            "$APP/Frameworks/WQScanCache.dylib"

          codesign \
            --force --sign - --timestamp=none \
            "$APP/Frameworks/FilzaApplySandboxExt.dylib"

          codesign \
            --force --deep --sign - --timestamp=none \
            "$APP"

          codesign --verify --deep --verbose=2 "$APP"

      - name: Package cached Filza IPA
        run: |
          cd "$RUNNER_TEMP/payload"

          zip -qry \
            "$GITHUB_WORKSPACE/FilzaWQCached-experimental.ipa" \
            Payload

          unzip -tq \
            "$GITHUB_WORKSPACE/FilzaWQCached-experimental.ipa"

          shasum -a 256 \
            "$GITHUB_WORKSPACE/FilzaWQCached-experimental.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FilzaWQCached-experimental
          path: FilzaWQCached-experimental.ipa
          retention-days: 7
