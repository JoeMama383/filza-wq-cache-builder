
name: Build Filza WQ Cached

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out builder
        uses: actions/checkout@v4

      - name: Download original Filza IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/base"

          echo "Release assets:"
          gh release view v0-base \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name'

          gh release download v0-base \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/base"

      - name: Prepare IPA from release attachment
        run: |
          python3 - <<'PY'
          import os
          import shutil
          import zipfile
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          source = root / "base"
          output = root / "filza_base.ipa"

          assets = [
              p for p in source.iterdir()
              if p.is_file()
              and p.suffix.lower() in (".ipa", ".zip")
          ]

          print("Found assets:", [p.name for p in assets])

          if len(assets) != 1:
              raise SystemExit(
                  "Release v0-base must contain exactly "
                  "one IPA or ZIP attachment."
              )

          asset = assets[0]

          if asset.suffix.lower() == ".ipa":
              shutil.copyfile(asset, output)
          else:
              with zipfile.ZipFile(asset) as archive:
                  names = archive.namelist()
                  matches = [
                      n for n in names
                      if n.lower().endswith(".ipa")
                      and not n.startswith("__MACOSX/")
                      and not n.endswith("/")
                  ]

                  if len(matches) == 1:
                      with archive.open(matches[0]) as src:
                          with output.open("wb") as dst:
                              shutil.copyfileobj(src, dst)
                  elif any(
                      n.startswith("Payload/")
                      for n in names
                  ):
                      shutil.copyfile(asset, output)
                  else:
                      raise SystemExit(
                          "ZIP does not contain a valid IPA."
                      )

          with zipfile.ZipFile(output) as archive:
              expected = (
                  "Payload/Filza.app/Frameworks/"
                  "FilzaApplySandboxExt.dylib"
              )

              if expected not in archive.namelist():
                  raise SystemExit(
                      "Required Filza library missing."
                  )

          print("Prepared IPA:", output)
          print("Size:", output.stat().st_size)
          PY

      - name: Verify original English Restricted Filza
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/payload"
          cd "$RUNNER_TEMP/payload"

          unzip -q "$RUNNER_TEMP/filza_base.ipa"

          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          binary = (
              root / "payload/Payload/Filza.app/"
              "Frameworks/FilzaApplySandboxExt.dylib"
          )

          if not binary.exists():
              raise SystemExit(
                  "FilzaApplySandboxExt.dylib missing."
              )

          actual = hashlib.sha256(
              binary.read_bytes()
          ).hexdigest()

          expected = (
              "b8cb5f1e48cebdb9"
              "ee0720abf1ca4005"
              "69e0aec1fd60e126"
              "46739f6573bf92dd"
          )

          print("Actual SHA-256:", actual)
          print("Expected SHA-256:", expected)

          if actual != expected:
              raise SystemExit(
                  "Unknown Filza build. Refusing to patch."
              )

          print("Original English Restricted Filza verified.")
          PY

      - name: Verify caching source exists
        run: |
          set -euo pipefail

          test -s src/WQScanCache.m

          echo "Caching source found."
          wc -l src/WQScanCache.m

      - name: Compile native iOS cache library
        run: |
          set -euo pipefail

          APP="$RUNNER_TEMP/payload/Payload/Filza.app"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          mkdir -p "$APP/Frameworks"

          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -miphoneos-version-min=17.0 \
            -isysroot "$SDK" \
            -O2 \
            -fobjc-arc \
            -fvisibility=hidden \
            -dynamiclib \
            -Wl,-install_name,@loader_path/WQScanCache.dylib \
            -framework Foundation \
            -o "$APP/Frameworks/WQScanCache.dylib" \
            src/WQScanCache.m

          echo "Compiled caching library:"
          file "$APP/Frameworks/WQScanCache.dylib"

      - name: Build Mach-O injection utility
        run: |
          set -euo pipefail

          git clone --depth 1 \
            https://github.com/tyilo/insert_dylib.git \
            "$RUNNER_TEMP/insert_dylib"

          xcodebuild \
            -project \
            "$RUNNER_TEMP/insert_dylib/insert_dylib.xcodeproj" \
            -scheme insert_dylib \
            -configuration Release \
            -derivedDataPath \
            "$RUNNER_TEMP/insert-dylib-build" \
            CODE_SIGNING_ALLOWED=NO \
            build

          TOOL="$(find \
            "$RUNNER_TEMP/insert-dylib-build" \
            -type f \
            -name insert_dylib \
            -perm -111 | head -n 1)"

          test -n "$TOOL"

          echo "$TOOL" > "$RUNNER_TEMP/injector_path"

          echo "Mach-O injection tool compiled."

      - name: Integrate caching library into Filza
        run: |
          set -euo pipefail

          APP="$RUNNER_TEMP/payload/Payload/Filza.app"
          TARGET="$APP/Frameworks/FilzaApplySandboxExt.dylib"
          TOOL="$(cat "$RUNNER_TEMP/injector_path")"

          "$TOOL" \
            --inplace \
            --all-yes \
            '@loader_path/WQScanCache.dylib' \
            "$TARGET"

          echo "Checking Mach-O dependencies:"

          otool -L "$TARGET"

          otool -L "$TARGET" \
            | grep -F '@loader_path/WQScanCache.dylib'

          echo "Caching dependency inserted."

      - name: Ad hoc sign modified application
        run: |
          set -euo pipefail

          APP="$RUNNER_TEMP/payload/Payload/Filza.app"

          codesign \
            --force \
            --sign - \
            --timestamp=none \
            "$APP/Frameworks/WQScanCache.dylib"

          codesign \
            --force \
            --sign - \
            --timestamp=none \
            "$APP/Frameworks/FilzaApplySandboxExt.dylib"

          codesign \
            --force \
            --deep \
            --sign - \
            --timestamp=none \
            "$APP"

          codesign --verify \
            --deep \
            --verbose=2 \
            "$APP"

          echo "Ad hoc signature verified."
          echo "SideStore must re-sign for installation."

      - name: Package experimental Filza IPA
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/payload"

          zip -qry \
            "$GITHUB_WORKSPACE/FilzaWQCached-experimental.ipa" \
            Payload

          unzip -tq \
            "$GITHUB_WORKSPACE/FilzaWQCached-experimental.ipa"

          shasum -a 256 \
            "$GITHUB_WORKSPACE/FilzaWQCached-experimental.ipa"

          echo "Experimental IPA successfully packaged."

      - name: Upload completed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FilzaWQCached-experimental
          path: FilzaWQCached-experimental.ipa
          if-no-files-found: error
          retention-days: 7
