
name: Build Filza WQ Cached v3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download base release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/base" "$RUNNER_TEMP/work"
          gh release download v0-base \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/base"

      - name: Extract and verify original Filza
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, shutil, subprocess, zipfile
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP'])
          assets = [
              p for p in (root/'base').iterdir()
              if p.suffix.lower() in {'.ipa', '.zip'}
          ]

          if len(assets) != 1:
              raise SystemExit(
                  f'Expected one IPA or ZIP, found {[p.name for p in assets]}'
              )

          asset = assets[0]
          ipa = root/'base.ipa'

          if asset.suffix.lower() == '.ipa':
              shutil.copy2(asset, ipa)
          else:
              with zipfile.ZipFile(asset) as outer:
                  candidates = [
                      n for n in outer.namelist()
                      if n.lower().endswith('.ipa')
                      and not n.startswith('__MACOSX/')
                  ]

                  if len(candidates) == 1:
                      with outer.open(candidates[0]) as src, ipa.open('wb') as dst:
                          shutil.copyfileobj(src, dst)
                  elif any(
                      n.startswith('Payload/')
                      for n in outer.namelist()
                  ):
                      shutil.copy2(asset, ipa)
                  else:
                      raise SystemExit('ZIP contains no IPA')

          work = root/'work'

          subprocess.run(
              ['unzip', '-q', str(ipa), '-d', str(work)],
              check=True
          )

          app = work/'Payload/Filza.app'
          library = app/'Frameworks/FilzaApplySandboxExt.dylib'

          original = hashlib.sha256(
              library.read_bytes()
          ).hexdigest()

          expected = (
              'b8cb5f1e48cebdb9'
              'ee0720abf1ca4005'
              '69e0aec1fd60e126'
              '46739f6573bf92dd'
          )

          if original != expected:
              raise SystemExit(
                  f'Unexpected Filza dylib SHA-256 {original}'
              )

          data = library.read_bytes()

          for text in (
              b'worse_query',
              b'App Data (by app)',
              b'App Groups',
              b'System Data',
              b'Extension Data (containers)',
              b'[WQ] added %lu Favorites entries'
          ):
              if text not in data:
                  raise SystemExit(
                      f'Missing original WQ feature: {text!r}'
                  )

          print('Verified English Restricted Filza')
          print('Original WQ folder and Favorites code retained')
          PY

      - name: Preserve original App Group entitlement
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, plistlib, subprocess
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP'])
          app = root/'work/Payload/Filza.app'
          groups = []

          try:
              result = subprocess.run(
                  [
                      'codesign', '-d',
                      '--entitlements', ':-', str(app)
                  ],
                  capture_output=True,
                  check=True
              )
              signed = plistlib.loads(result.stdout)
              groups = signed.get(
                  'com.apple.security.application-groups', []
              )
          except Exception as exc:
              print('Original signature read failed:', exc)

          if not groups:
              profile = app/'embedded.mobileprovision'

              if not profile.exists():
                  raise SystemExit(
                      'No App Group entitlement or profile available'
                  )

              raw = subprocess.check_output([
                  'security', 'cms', '-D', '-i', str(profile)
              ])

              groups = plistlib.loads(raw)[
                  'Entitlements'
              ].get('com.apple.security.application-groups', [])

          if (
              not isinstance(groups, list)
              or not groups
              or not all(
                  isinstance(g, str) and g.startswith('group.')
                  for g in groups
              )
          ):
              raise SystemExit(
                  'Original IPA does not specify usable App Groups'
              )

          minimal = {
              'com.apple.security.application-groups': groups,
              'get-task-allow': False
          }

          with (root/'Filza.entitlements').open('wb') as f:
              plistlib.dump(minimal, f)

          print(
              'Preserving App Group declaration:',
              len(groups), 'groups'
          )
          PY

      - name: Compile guarded v3 caching library
        run: |
          set -euo pipefail

          test -s src/WQScanCache.m

          APP="$RUNNER_TEMP/work/Payload/Filza.app"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -miphoneos-version-min=17.0 \
            -isysroot "$SDK" \
            -O2 \
            -fobjc-arc \
            -dynamiclib \
            -Wl,-install_name,@loader_path/WQScanCache.dylib \
            -framework Foundation \
            -o "$APP/Frameworks/WQScanCache.dylib" \
            src/WQScanCache.m

      - name: Build binary load-command editor
        run: |
          set -euo pipefail

          git clone -q --depth 1 \
            https://github.com/tyilo/insert_dylib.git \
            "$RUNNER_TEMP/insert_dylib"

          xcodebuild \
            -project "$RUNNER_TEMP/insert_dylib/insert_dylib.xcodeproj" \
            -scheme insert_dylib \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/insert-dylib-build" \
            CODE_SIGNING_ALLOWED=NO \
            build

          TOOL="$(find "$RUNNER_TEMP/insert-dylib-build" \
            -type f \
            -name insert_dylib \
            -perm -111 | head -n 1)"

          test -n "$TOOL"

          echo "$TOOL" > "$RUNNER_TEMP/injector_path"

      - name: Insert guarded cache dependency
        run: |
          set -euo pipefail

          APP="$RUNNER_TEMP/work/Payload/Filza.app"
          TARGET="$APP/Frameworks/FilzaApplySandboxExt.dylib"
          TOOL="$(cat "$RUNNER_TEMP/injector_path")"

          "$TOOL" \
            --inplace \
            --all-yes \
            '@loader_path/WQScanCache.dylib' \
            "$TARGET"

          otool -L "$TARGET" \
            | grep -F '@loader_path/WQScanCache.dylib'

      - name: Sign while retaining App Group entitlement
        run: |
          set -euo pipefail

          APP="$RUNNER_TEMP/work/Payload/Filza.app"

          codesign \
            --force \
            --sign - \
            --timestamp=none \
            "$APP/Frameworks/WQScanCache.dylib"

          codesign \
            --force \
            --sign - \
            --timestamp=none \
            "$APP/Frameworks/FilzaApplySandboxExt.dylib"

          codesign \
            --force \
            --deep \
            --sign - \
            --timestamp=none \
            --entitlements "$RUNNER_TEMP/Filza.entitlements" \
            "$APP"

          codesign --verify \
            --deep \
            --verbose=2 \
            "$APP"

          python3 - <<'PY'
          import os, plistlib, subprocess
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP'])
          app = root/'work/Payload/Filza.app'

          raw = subprocess.check_output(
              [
                  'codesign', '-d',
                  '--entitlements', ':-', str(app)
              ],
              stderr=subprocess.DEVNULL
          )

          signed = plistlib.loads(raw)

          actual = signed.get(
              'com.apple.security.application-groups', []
          )

          if not actual:
              raise SystemExit(
                  'App Group entitlement missing AFTER signing'
              )

          print('App Groups verified after signing:', len(actual))
          PY

      - name: Package Filza WQ Cached v3 IPA
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/work"

          zip -qry \
            "$GITHUB_WORKSPACE/FilzaWQCached-v3.ipa" \
            Payload

          unzip -tq \
            "$GITHUB_WORKSPACE/FilzaWQCached-v3.ipa"

          shasum -a 256 \
            "$GITHUB_WORKSPACE/FilzaWQCached-v3.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FilzaWQCached-v3
          path: FilzaWQCached-v3.ipa
          if-no-files-found: error
          retention-days: 7
